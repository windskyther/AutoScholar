# Launch only with an explicit unique autoscholar-eval-* project and phase10d.defaults.
# Cached images only; source-only mount; no provider settings, application DB or workspace.
services:
  sandbox-manager:
    image: '${AUTOSCHOLAR_EVAL_MANAGER_IMAGE}'
    pull_policy: never
    working_dir: /app
    command: [uvicorn, autoscholar.sandbox.manager:app, --host, 0.0.0.0, --port, '8090', --no-access-log]
    environment:
      SANDBOX_IMAGE: '${AUTOSCHOLAR_EVAL_SANDBOX_IMAGE}'
      SANDBOX_DATASET_VOLUME: autoscholar_mnist_data
      SANDBOX_DATASET_READY_FILE: /datasets/mnist/.autoscholar-ready
      SANDBOX_MEMORY_BYTES: '2147483648'
      SANDBOX_NANO_CPUS: '2000000000'
      SANDBOX_PIDS_LIMIT: '128'
      SANDBOX_MAX_OUTPUT_BYTES: '65536'
      SANDBOX_MAX_ARTIFACT_FILE_BYTES: '16777216'
      SANDBOX_MAX_ARTIFACT_BYTES: '67108864'
      AUTOSCHOLAR_EVAL_OWNER: '${COMPOSE_PROJECT_NAME}'
    volumes:
      - ../src:/app/src:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - public-mnist:/datasets/mnist:ro
    networks: [isolated]
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=67108864']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
networks:
  isolated:
    internal: true
volumes:
  public-mnist:
    external: true
    name: autoscholar_mnist_data
