        # 50 MiB document + 1 MiB multipart overhead; API still counts actual bytes.
        client_max_body_size 51m;
        client_body_timeout 15s;
        send_timeout 15s;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header X-Request-ID $request_id always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        location = /health/live { access_log off; return 200 'ok\n'; }
        location = /api { return 308 /api/; }
        location ^~ /api/ {
            proxy_pass http://autoscholar_api/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection '';
            proxy_set_header Forwarded '';
            proxy_set_header X-Forwarded-For '';
            proxy_set_header X-Forwarded-Host '';
            proxy_set_header X-Forwarded-Proto '';
            proxy_set_header X-Real-IP '';
            proxy_hide_header X-Request-ID;
            proxy_redirect ~^https?://[^/]+(/.*)$ /api$1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_next_upstream off;
            proxy_connect_timeout 5s;
            proxy_send_timeout 120s;
            proxy_read_timeout 1900s;
        }
        location ~ /\. { return 404; }
        location ~* \.(?:map|env|md|toml|lock|py|ya?ml)$ { return 404; }
        location /assets/ { try_files $uri =404; expires 1y; }
        location / { expires -1; try_files $uri $uri/ /index.html; }
