name: autoscholar

services:
  api:
    build:
      context: .
    environment:
      APP_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://autoscholar:autoscholar@postgres:5432/autoscholar
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-autoscholar_chunks_v1}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      RESEARCH_TIMEOUT_SECONDS: ${RESEARCH_TIMEOUT_SECONDS:-20}
      RESEARCH_CACHE_TTL_SECONDS: ${RESEARCH_CACHE_TTL_SECONDS:-86400}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fastembed}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      SPARSE_MODEL: ${SPARSE_MODEL:-Qdrant/bm25}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-base}
      MODEL_CACHE_PATH: /models
      DOCUMENT_STORAGE_PATH: /data/documents
      DOCUMENT_MAX_BYTES: ${DOCUMENT_MAX_BYTES:-52428800}
      DOCUMENT_MAX_PAGES: ${DOCUMENT_MAX_PAGES:-500}
      DOCUMENT_PARSE_TIMEOUT_SECONDS: ${DOCUMENT_PARSE_TIMEOUT_SECONDS:-120}
      RAG_CHUNK_TOKENS: ${RAG_CHUNK_TOKENS:-96}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-16}
      RAG_TOP_K: ${RAG_TOP_K:-8}
      RAG_CANDIDATE_LIMIT: ${RAG_CANDIDATE_LIMIT:-30}
      RAG_WORKER_POLL_SECONDS: ${RAG_WORKER_POLL_SECONDS:-2}
      RAG_JOB_LEASE_SECONDS: ${RAG_JOB_LEASE_SECONDS:-600}
      RAG_JOB_MAX_ATTEMPTS: ${RAG_JOB_MAX_ATTEMPTS:-3}
      WORKSPACE_ROOT: /data/workspaces
      WORKSPACE_MAX_FILES: ${WORKSPACE_MAX_FILES:-100}
      WORKSPACE_MAX_FILE_BYTES: ${WORKSPACE_MAX_FILE_BYTES:-1048576}
      WORKSPACE_MAX_SOURCE_BYTES: ${WORKSPACE_MAX_SOURCE_BYTES:-10485760}
      SANDBOX_MANAGER_URL: http://sandbox-manager:8090
      SANDBOX_TIMEOUT_SECONDS: ${SANDBOX_TIMEOUT_SECONDS:-300}
      SANDBOX_MAX_REPAIRS: ${SANDBOX_MAX_REPAIRS:-3}
    volumes:
      - document_data:/data/documents
      - model_cache:/models
      - workspace_data:/data/workspaces
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      sandbox-manager:
        condition: service_healthy
    networks:
      - default
      - sandbox_control
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  migrate:
    build:
      context: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://autoscholar:autoscholar@postgres:5432/autoscholar
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  worker:
    build:
      context: .
    command: ["python", "-m", "autoscholar.rag.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://autoscholar:autoscholar@postgres:5432/autoscholar
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-autoscholar_chunks_v1}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fastembed}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      SPARSE_MODEL: ${SPARSE_MODEL:-Qdrant/bm25}
      MODEL_CACHE_PATH: /models
      DOCUMENT_STORAGE_PATH: /data/documents
      DOCUMENT_MAX_PAGES: ${DOCUMENT_MAX_PAGES:-500}
      DOCUMENT_PARSE_TIMEOUT_SECONDS: ${DOCUMENT_PARSE_TIMEOUT_SECONDS:-120}
      RAG_CHUNK_TOKENS: ${RAG_CHUNK_TOKENS:-96}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-16}
      RAG_WORKER_POLL_SECONDS: ${RAG_WORKER_POLL_SECONDS:-2}
      RAG_JOB_LEASE_SECONDS: ${RAG_JOB_LEASE_SECONDS:-600}
      RAG_JOB_MAX_ATTEMPTS: ${RAG_JOB_MAX_ATTEMPTS:-3}
    volumes:
      - document_data:/data/documents
      - model_cache:/models
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 3g

  sandbox-image:
    image: autoscholar-python-sandbox:phase4
    build:
      context: .
      dockerfile: docker/sandbox/Dockerfile
    command: ["python", "-c", "import torch, torchvision; print('sandbox image ready')"]
    network_mode: none
    restart: "no"

  sandbox-manager:
    build:
      context: .
    command:
      - uvicorn
      - autoscholar.sandbox.manager:app
      - --host
      - 0.0.0.0
      - --port
      - "8090"
    environment:
      SANDBOX_IMAGE: autoscholar-python-sandbox:phase4
      SANDBOX_DATASET_VOLUME: autoscholar_mnist_data
      SANDBOX_DATASET_READY_FILE: /datasets/mnist/.autoscholar-ready
      SANDBOX_MEMORY_BYTES: ${SANDBOX_MEMORY_BYTES:-4294967296}
      SANDBOX_NANO_CPUS: ${SANDBOX_NANO_CPUS:-2000000000}
      SANDBOX_PIDS_LIMIT: ${SANDBOX_PIDS_LIMIT:-256}
      SANDBOX_MAX_OUTPUT_BYTES: ${SANDBOX_MAX_OUTPUT_BYTES:-65536}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - mnist_data:/datasets/mnist:ro
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
    networks:
      - sandbox_control
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8090/internal/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  mnist-init:
    profiles: ["datasets"]
    image: autoscholar-python-sandbox:phase4
    user: "0:0"
    command: ["python", "/opt/autoscholar/prepare_mnist.py"]
    environment:
      MNIST_ROOT: /datasets/mnist
    volumes:
      - mnist_data:/datasets/mnist
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: autoscholar
      POSTGRES_USER: autoscholar
      POSTGRES_PASSWORD: autoscholar
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoscholar -d autoscholar"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  document_data:
  model_cache:
  workspace_data:
  mnist_data:
    name: autoscholar_mnist_data

networks:
  sandbox_control:
    internal: true
