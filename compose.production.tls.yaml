# Requires Compose 2.24.4+; !override removes the HTTP published port.
services:
  web:
    ports: !override ['127.0.0.1:${PROD_TLS_PORT:-8443}:8443']
    volumes:
      - ./docker/web/server-tls.conf:/etc/nginx/autoscholar/server.conf:ro
    secrets: [tls_cert, tls_key]
    healthcheck:
      test: [CMD, wget, --no-check-certificate, -q, -O, /dev/null, 'https://127.0.0.1:8443/health/live']
secrets:
  tls_cert: {file: '${PROD_TLS_CERT:?Set a certificate file}'}
  tls_key: {file: '${PROD_TLS_KEY:?Set a private key file}'}
