[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "autoscholar"
version = "0.1.0"
description = "Autonomous AI/ML research and experiment agent platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "langgraph>=0.6,<2",
    "openai>=1.100,<3",
    "pydantic-settings>=2.10,<3",
    "redis>=6,<8",
    "sqlalchemy[asyncio]>=2.0,<3",
    "structlog>=25,<26",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21,<1",
    "mypy>=1.17,<2",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "pytest-cov>=6.2,<8",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/autoscholar"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra -p no:cacheprovider"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require the running Docker Compose stack",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
