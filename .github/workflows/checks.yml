name: Checks

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.10"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"
  PYTHONUTF8: "1"

jobs:
  containers:
    needs: [supply-chain, backend, windows, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: uv sync --frozen --python $PYTHON_VERSION
      - run: npm ci
        working-directory: web
      - run: node scripts/browser.mjs install --with-deps chromium
        working-directory: web
      - run: uv run --no-sync python scripts/build_production.py --sandbox --pull --refresh-system
      - run: uv run --no-sync python scripts/verify_stack.py --download-dataset
      - run: uv run --no-sync python scripts/verify_production.py
      - run: uv run --no-sync python scripts/verify_production.py --tls
      - run: uv run --no-sync python scripts/verify_production.py --workflow --download-dataset
      - run: uv run --no-sync python scripts/verify_production.py --workflow --fault-once --download-dataset
      - run: uv run --no-sync python scripts/verify_recovery.py
      - run: uv run --no-sync python scripts/install_security_tools.py trivy
      - run: uv run --no-sync python scripts/audit_images.py

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: uv sync --frozen --group security --python $PYTHON_VERSION
      - run: uv run --no-sync python scripts/install_security_tools.py gitleaks
      - run: uv run --no-sync python scripts/check_repository.py --gitleaks data/tooling/gitleaks/8.30.1/gitleaks
      - run: uv run --no-sync python scripts/check_scanner.py --gitleaks data/tooling/gitleaks/8.30.1/gitleaks
      - run: uv run --no-sync python scripts/audit_dependencies.py --output data/validation/ci-audit

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: public-fixture-only
          POSTGRES_DB: phase11c
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      PHASE11C_REDIS_URL: redis://127.0.0.1:6379/0
      PHASE11C_DATABASE_URL: postgresql+asyncpg://postgres:public-fixture-only@127.0.0.1:5432/phase11c
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv sync --frozen --python $PYTHON_VERSION
      - run: uv run --no-sync ruff check src tests scripts migrations
      - run: uv run --no-sync mypy --no-incremental
      - run: uv run --no-sync pytest -q --tb=short --show-capture=no --basetemp=data/ci-tmp

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv sync --frozen --python $env:PYTHON_VERSION
      - run: uv run --no-sync mypy --no-incremental
      - run: >-
          uv run --no-sync pytest -q --tb=short --show-capture=no
          tests/test_config.py tests/test_experiment_auth.py tests/test_api_access.py
          tests/test_request_governance.py tests/test_security_redaction.py
          tests/test_sandbox.py tests/test_sandbox_security.py tests/test_phase11_replan_security.py
          tests/test_coding_workspace.py tests/test_filesystem_mcp.py
          tests/test_production_package.py
          tests/test_collection_isolation.py tests/test_backup_archives.py
          tests/test_operations.py tests/test_release_gate.py
          tests/test_cpu_acceptance.py tests/test_production_build.py
          --basetemp=data/ci-tmp

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/browser.mjs install --with-deps chromium
      - run: npm run test:browser
